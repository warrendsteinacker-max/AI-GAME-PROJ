appId: com.mydesktopapp.id
productName: MyDesktopApp
asar: true
asarUnpack:
  - "src/server/**/*"
files:
  - "out/**/*"
  - "src/server/**/*"
win:
  requestedExecutionLevel: requireAdministrator
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  createDesktopShortcut: true
  createStartMenuShortcut: true