

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Inventory & Purchase Tracker</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1, h2, h3 { margin-top: 0; margin-bottom: 10px; }
        .container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        #reader-container {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        #reader {
            width: 100%;
            background: #fafafa;
            border: 2px dashed #ccc;
            border-radius: 6px;
            overflow: hidden;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 15px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        button.secondary { background-color: #28a745; }
        button.secondary:hover { background-color: #218838; }
        button.action-snap { background-color: #ffc107; color: #212529; font-size: 1.2rem; padding: 15px; margin-top: 10px; }
        button.action-snap:hover { background-color: #e0a800; }
        button.danger { background-color: #dc3545; margin-top: 0; padding: 6px 10px; font-size: 0.85rem; width: auto;}
        button.danger:hover { background-color: #c82333; }
        
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .cam-row { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 10px; 
            width: 100%;
        }
        .cam-row button { 
            flex: 1; 
            font-size: 0.9rem; 
            padding: 10px; 
            background-color: #6c757d; 
            margin-top: 0;
        }
        .cam-active { 
            background-color: #0056b3 !important; 
            outline: 3px solid #ffc107; 
            color: white !important;
        }
        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }
        .item-card {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8f0;
        }
        .search-box { border-left: 5px solid #17a2b8; }
        .hidden { display: none !important; }
        .status-banner {
            background-color: #e2e8f0;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>Local Item Tracker</h1>
    <div id="api-status" class="status-banner">Connecting to secure server platform backend...</div>

    <div class="container">
        <h2>1. Camera Scanner</h2>
        
        <div class="cam-row">
            <button id="btn-front" onclick="selectCamera('user')">🔬 Front Camera</button>
            <button id="btn-back" class="cam-active" onclick="selectCamera('environment')">📷 Back Camera</button>
        </div>

        <button id="view-btn" onclick="toggleCameraView()">Turn Camera Stream ON</button>

        <div id="reader-container" class="hidden">
            <div id="reader"></div>
            <button id="snap-btn" class="action-snap" onclick="executeManualScan()">🎯 SNAP & SCAN BARCODE NOW</button>
        </div>
    </div>

    <div class="container" style="border-left: 5px solid #6c757d;">
        <h2>2. Manual Selection Logging</h2>
        <label for="quick-inventory-select">Choose Item from Master Inventory Dictionary:</label>
        <select id="quick-inventory-select">
            <option value="">-- Loading inventory options... --</option>
        </select>
        <button class="secondary" onclick="purchaseFromSelect()">Log Selected Item as Purchased</button>
    </div>

    <div class="container search-box">
        <h2>3. Master Inventory Search</h2>
        <input type="text" id="search-input" onkeyup="renderLists()" placeholder="Type item description or code to filter lists...">
        
        <h3>Registered Dictionary Items</h3>
        <ul id="inventory-ui-list" class="item-list"></ul>
    </div>

    <div class="container" style="border-left: 5px solid #6f42c1;">
        <h2>4. Live Purchase Logs</h2>
        <ul id="purchased-ui-list" class="item-list"></ul>
    </div>

    <script>
        const API_BASE = window.location.origin;

        let inventoryItems = [];
        let purchasedLog = [];
        
        let html5Qrcode = null; 
        let cameraStreaming = false;
        let currentCamera = 'environment'; 

        // --- FETCH SYNC PIPELINES FROM EXPRESS BACKEND ---
        async function loadDataFromBackend() {
            try {
                const pingRes = await fetch(`${API_BASE}/api/ping`);
                if (pingRes.ok) {
                    const pingData = await pingRes.json();
                    document.getElementById('api-status').innerHTML = `✅ Connected to <b>${pingData.ip}:${pingData.port}</b> via HTTPS. App Armed.`;
                    document.getElementById('api-status').style.backgroundColor = "#d4edda";
                    document.getElementById('api-status').style.color = "#155724";
                }

                const invRes = await fetch(`${API_BASE}/api/inventory`);
                if (invRes.ok) inventoryItems = await invRes.json();

                const purRes = await fetch(`${API_BASE}/api/purchases`);
                if (purRes.ok) purchasedLog = await purRes.json();

                renderLists();
            } catch (err) {
                console.error("Database connection failure: ", err);
                document.getElementById('api-status').innerText = "❌ Connection Failed. Check server terminal logs.";
                document.getElementById('api-status').style.backgroundColor = "#f8d7da";
                document.getElementById('api-status').style.color = "#721c24";
            }
        }

        // --- CAMERA SELECT ROTATOR ---
        async function selectCamera(facingMode) {
            if (currentCamera === facingMode) return;
            
            currentCamera = facingMode;
            document.getElementById('btn-front').classList.toggle('cam-active', facingMode === 'user');
            document.getElementById('btn-back').classList.toggle('cam-active', facingMode === 'environment');

            if (cameraStreaming) {
                await stopCameraStream();
                startCameraStream();
            }
        }

        // --- CAMERA STREAM INITIALIZER ---
        async function toggleCameraView() {
            if (cameraStreaming) {
                await stopCameraStream();
            } else {
                startCameraStream();
            }
        }

        function startCameraStream() {
            const containerDiv = document.getElementById('reader-container');
            const viewBtn = document.getElementById('view-btn');

            containerDiv.classList.remove('hidden');
            viewBtn.innerText = "Turn Camera Stream OFF";
            viewBtn.style.backgroundColor = "#6c757d";
            cameraStreaming = true;

            html5Qrcode = new Html5Qrcode("reader");

            const config = { 
                fps: 20, // Keep stream smooth on video feed
                qrbox: { width: 260, height: 160 }
            };

            // Start the view feed, but ignore the continuous scan callback loop
            html5Qrcode.start(
                { facingMode: currentCamera }, 
                config, 
                () => {}, // Leaving continuous success handler EMPTY on purpose
                () => {}  // Leaving continuous failure handler EMPTY on purpose
            ).catch(err => {
                console.error("Camera thread access error: ", err);
                stopCameraStream();
            });
        }

        async function stopCameraStream() {
            if (!html5Qrcode) {
                cameraStreaming = false;
                return;
            }

            try {
                if (html5Qrcode.isScanning) {
                    await html5Qrcode.stop();
                }
            } catch (err) {
                console.error("Video breakdown stream error: ", err);
            } finally {
                html5Qrcode = null;
                cameraStreaming = false;
                document.getElementById('reader-container').classList.add('hidden');
                const viewBtn = document.getElementById('view-btn');
                viewBtn.innerText = "Turn Camera Stream ON";
                viewBtn.style.backgroundColor = "#007bff";
            }
        }

        // --- MANUALLY TRIGGERED SNAPSHOT SCAN & POST PIPELINE ---
        async function executeManualScan() {
            if (!html5Qrcode || !html5Qrcode.isScanning) {
                alert("Camera stream must be active first!");
                return;
            }

            const snapBtn = document.getElementById('snap-btn');
            snapBtn.innerText = "⏳ SCANNING FRAME...";
            snapBtn.style.backgroundColor = "#ffc107";

            // Find the active internal video canvas context layer rendered by the library
            const videoElement = document.querySelector('#reader video');
            if (!videoElement) {
                alert("Video frame element could not be verified in the DOM.");
                snapBtn.innerText = "🎯 SNAP & SCAN BARCODE NOW";
                return;
            }

            try {
                // Pass the direct, live canvas image track into the engine for a single barcode decoding attempt
                const decodedText = await html5Qrcode.scanFile(videoElement);
                
                console.log(`🎯 Barcode Found on Button Click: ${decodedText}`);
                snapBtn.innerText = `✅ FOUND: ${decodedText}`;
                snapBtn.style.backgroundColor = "#28a745";

                // Resolve names locally using current local db configuration copy
                const knownMatch = inventoryItems.find(i => i.barcode === decodedText);
                const itemName = knownMatch ? knownMatch.name : `Barcode item ${decodedText}`;

                // Structure complete server JSON structures
                const purchasePayload = { barcode: decodedText, name: itemName };
                const scanPayload = { 
                    barcode: decodedText, 
                    camera: currentCamera === 'environment' ? 'back' : 'front',
                    device: navigator.userAgent
                };

                // Stream requests down API endpoint corridors
                await fetch(`${API_BASE}/api/scans`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(scanPayload)
                });

                const purResponse = await fetch(`${API_BASE}/api/purchases`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(purchasePayload)
                });

                if (purResponse.ok) {
                    // Instantly sync tables up so user interface additions render down immediately
                    await loadDataFromBackend();
                }

            } catch (err) {
                // Occurs if the button was clicked but no recognizable barcode was found in that specific frame
                console.warn("Barcode match validation structural check failed on frame capture target.", err);
                snapBtn.innerText = "❌ NO BARCODE SEEN. TRY AGAIN.";
                snapBtn.style.backgroundColor = "#dc3545";
            } finally {
                // Return button back to active state after a brief visual delay
                setTimeout(() => {
                    if (snapBtn) {
                        snapBtn.innerText = "🎯 SNAP & SCAN BARCODE NOW";
                        snapBtn.style.backgroundColor = "#ffc107";
                    }
                }, 2000);
            }
        }

        // --- QUICK SELECT DIRECT ROUTER ---
        async function purchaseFromSelect() {
            const selectEl = document.getElementById('quick-inventory-select');
            const selectedId = selectEl.value;
            if (!selectedId) return;

            const baseTemplate = inventoryItems.find(item => item.id === selectedId);
            if (!baseTemplate) return;

            try {
                const response = await fetch(`${API_BASE}/api/purchases`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ barcode: baseTemplate.barcode, name: baseTemplate.name })
                });

                if (response.ok) {
                    await loadDataFromBackend();
                }
            } catch (err) {
                console.error("Manual selection request logging failure: ", err);
            }
        }

        // --- BACKEND DELETION COMMAND HANDLERS ---
        async function deleteItem(id, listType) {
            const endpoint = listType === 'inventory' ? `/api/inventory/${id}` : `/api/purchases/${id}`;
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, { method: 'DELETE' });
                if (response.ok) {
                    await loadDataFromBackend();
                }
            } catch (err) {
                console.error("Record target erasure crash: ", err);
            }
        }

        // --- ASYNC RUNTIME RENDERING ---
        function renderLists() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            
            const inventoryUI = document.getElementById('inventory-ui-list');
            const purchasedUI = document.getElementById('purchased-ui-list');
            const selectUI = document.getElementById('quick-inventory-select');

            inventoryUI.innerHTML = "";
            const filteredInventory = inventoryItems.filter(item => 
                item.name.toLowerCase().includes(searchQuery) || item.barcode.includes(searchQuery)
            );

            if (filteredInventory.length === 0) {
                inventoryUI.innerHTML = `<li style="color:#888; font-size:0.9rem; padding: 5px;">No inventory definitions loaded.</li>`;
            } else {
                filteredInventory.forEach(item => {
                    inventoryUI.innerHTML += `
                        <li class="item-card">
                            <div>
                                <strong>${item.name}</strong><br>
                                <span style="font-size:0.8rem; color:#666;">Code: ${item.barcode}</span>
                            </div>
                            <button class="danger" onclick="deleteItem('${item.id}', 'inventory')">Remove</button>
                        </li>`;
                });
            }

            purchasedUI.innerHTML = "";
            const filteredPurchases = purchasedLog.filter(item => 
                item.name.toLowerCase().includes(searchQuery) || item.barcode.includes(searchQuery)
            );

            if (filteredPurchases.length === 0) {
                purchasedUI.innerHTML = `<li style="color:#888; font-size:0.9rem; padding: 5px;">No tracking items found inside current db stack.</li>`;
            } else {
                filteredPurchases.forEach(item => {
                    const timeString = new Date(item.loggedAt).toLocaleTimeString();
                    purchasedUI.innerHTML += `
                        <li class="item-card" style="border-left: 4px solid #6f42c1;">
                            <div>
                                <strong>${item.name}</strong><br>
                                <span style="font-size:0.75rem; color:#888;">Logged Instance: ${timeString} | Code: ${item.barcode}</span>
                            </div>
                            <button class="danger" onclick="deleteItem('${item.id}', 'purchased')">Delete</button>
                        </li>`;
                });
            }

            const selectedVal = selectUI.value;
            selectUI.innerHTML = inventoryItems.length === 0 
                ? `<option value="">-- No registered inventory items --</option>`
                : inventoryItems.map(item => `<option value="${item.id}">${item.name} (${item.barcode})</option>`).join('');
            if (selectedVal) selectUI.value = selectedVal;
        }

        document.addEventListener("DOMContentLoaded", loadDataFromBackend);
    </script>
</body>
</html>
